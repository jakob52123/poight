<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Poight 手机手柄</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#102734;color:#fff4ce;font:16px system-ui}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}header{height:60px;display:flex;align-items:center;justify-content:space-around;gap:8px}form{display:flex;gap:5px}input{width:110px;text-transform:uppercase}button,input{font:inherit;min-height:44px;border:2px solid #8eb9ad;border-radius:12px}button{background:#286e81;color:white;touch-action:none;user-select:none}main{display:flex;align-items:center;justify-content:space-around;height:calc(100% - 60px);gap:15px}#padStick{width:min(40vw,240px);height:min(40vw,240px);border-radius:50%;background:#2b5260;border:3px solid #8eb9ad;position:relative;touch-action:none}#padKnob{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#f5d38c;pointer-events:none}.buttons{display:grid;grid-template-columns:repeat(3,minmax(70px,100px));gap:12px}.buttons button{height:70px;font-weight:bold}#rotateHint{display:none}@media(orientation:portrait){header{height:auto;min-height:100px;flex-wrap:wrap}main{height:auto;min-height:70%;flex-direction:column}.buttons{gap:8px}#rotateHint{display:block;text-align:center}#padStick{width:180px;height:180px}}
</style><script src="/手机手柄.js" defer></script></head><body>
<header><form id="joinRoom"><label>房间 <input id="roomCode" maxlength="6" autocomplete="off" required aria-label="房间码"></label><button>连接</button></form><span id="padStatus" role="status">输入电脑上的房间码</span><button data-action="start">开始 / 继续</button></header>
<p id="rotateHint">横屏体验最佳</p><main><div id="padStick" role="group" aria-label="移动摇杆"><i id="padKnob"></i></div><div class="buttons"><button data-action="move0">招式 1</button><button data-action="move1">招式 2</button><button data-action="jump">跳跃</button><button data-action="move2">招式 3</button><button data-action="move3">招式 4</button><button data-action="dash">闪避</button></div></main>
</body></html>
