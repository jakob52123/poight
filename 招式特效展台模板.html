</style><div class="app"><aside class="sidebar" id="sidebar"><span class="eyebrow">POCKET ARENA / MOVE LAB</span><h1>57 招 · 实景试招</h1><input id="search" type="search" placeholder="搜索招式或属性" aria-label="搜索招式"><div class="categories" id="categories" role="group" aria-label="特效分类"></div><nav class="list" id="list" aria-label="选择招式"></nav><div class="count" id="count"></div><div class="reference">游戏原地图＋原生精灵动作<br>无联网依赖，可直接双击打开</div></aside><main class="main"><div class="main-inner"><header class="header"><div><span class="eyebrow" id="number"></span><h2 id="moveName"></h2></div><span class="badge" id="typeBadge"></span><button id="mobileList">选择招式 ☰</button></header><p class="description" id="description"></p><div class="stage"><canvas id="view" width="1920" height="1080" aria-label="招式特效动态预览"></canvas><div class="phase"><span id="phase"></span><small id="phaseHint"></small></div></div><div class="controls"><button id="previous" aria-label="上一招">← 上一招</button><button id="next" aria-label="下一招">下一招 →</button><button id="play">暂停</button><button id="restart">重播</button><button id="slow" aria-pressed="false">慢放 ×0.25</button><button id="normal" aria-pressed="true">正常 ×1</button><span class="gap"></span><button id="hit" aria-pressed="true">命中</button><button id="miss" aria-pressed="false">打空</button><button id="actor" aria-pressed="true">显示精灵</button></div><input id="time" class="timeline" type="range" min="0" max="2.8" value="0" step="0.005" aria-label="拖动检查特效"><div class="ticks"><span>蓄力</span><span>出招</span><span>命中 / 生效</span><span>消散</span></div><div class="footer"><span id="status" role="status"></span><span>同一张游戏地图与精灵素材，自动匹配施术角色。<br>独立动作演示；尚未接入正式战斗与伤害判定。</span></div></div></main></div><script>const LAB_DATA=__DATA__;</script><script>__EFFECTS__</script><script>
'use strict';const $=id=>document.getElementById(id),moves=LAB_DATA.moves,ids=Object.keys(moves),types=LAB_DATA.types,ctx=$('view').getContext('2d'),atlas=new Image(),art=__ART__;atlas.src='data:image/png;base64,__SPRITE__';const categories={all:'全部',ranged:'弹道 / 光束',contact:'近身 / 冲刺',area:'范围',support:'辅助'},kindNames={shot:'弹道',fan:'散射',beam:'光束',melee:'近身',rush:'冲刺',spin:'环扫',zone:'落点范围',nova:'周身范围',heal:'回复',buff:'强化',guard:'防护'};let current='bravebird',category='all',filtered=[...ids],t=0,playing=true,speed=1,hit=true,showActor=true,last=performance.now();const total=2.8;

function state(){const m=moves[current];let phase,u;if(t<.55){phase='charge';u=t/.55;}else if(t<1.15){phase='action';u=(t-.55)/.6;}else if(t<1.6){phase='impact';u=(t-1.15)/.45;}else{phase='recover';u=(t-1.6)/1.2;}const support=group(m)==='support',target={x:730,y:hit?260:150};let source={x:200,y:260};if(support){source={x:470,y:260};target.x=470;target.y=260;}else if(m.kind==='nova')source={x:630,y:hit?260:150};else if(['melee','spin'].includes(m.kind))source={x:target.x-65,y:target.y};else if(m.kind==='rush'){const a=phase==='charge'?0:phase==='action'?u:1;source={x:200+(target.x-35-200)*a,y:260+(target.y-260)*a};}return{m,t,phase,u,source,target,hit:support?true:hit,seed:ids.indexOf(current)+17};}

function actor(s){if(!showActor||!atlas.complete||!atlas.naturalWidth)return;const frame=Math.floor(t/.1)%art.frames,row=6,scale=2.1;ctx.drawImage(atlas,frame*art.frameWidth,row*art.frameHeight,art.frameWidth,art.frameHeight,Math.round(s.source.x-art.anchorX*scale),Math.round(s.source.y-art.anchorY*scale),art.frameWidth*scale,art.frameHeight*scale);}
function render(){ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;const s=state();ScenePreview.draw(ctx,s,showActor);try{if(!window.MoveFX?.[current]?.draw)throw Error('缺少特效模块');ctx.save();try{window.MoveFX[current].draw(ctx,s);}finally{ctx.restore();}$('status').classList.remove('error');text('status',`${t.toFixed(2)}s / 2.80s · ${speed===1?'正常速度':'四分之一速度'} · ${playing?'循环播放':'暂停'}${group(s.m)==='support'?' · 辅助招式作用于自身':hit?' · 命中演示':' · 偏离目标，不触发命中爆裂'}`);}catch(e){setPlaying(false);$('status').classList.add('error');text('status',s.m.name+' 绘制失败：'+e.message);console.error(e);}text('phase',({charge:'01 / 蓄力',action:'02 / 出招',impact:group(s.m)==='support'?'03 / 生效':hit?'03 / 命中':'03 / 打空',recover:'04 / 消散'})[s.phase]);text('phaseHint','可暂停、慢放或拖动时间条逐段查看');$('time').value=t;}
function frame(now){const dt=Math.min(.08,(now-last)/1000);last=now;if(playing)t=(t+dt*speed)%total;render();requestAnimationFrame(frame);}drawList();select(current);requestAnimationFrame(frame);window.__lab={ids,moves,select,seek(value){t=Math.max(0,Math.min(total,Number(value)));setPlaying(false);render();},setHit(value){hit=!!value;pressed('hit',hit);pressed('miss',!hit);render();},snapshot:()=>({current,t,playing,speed,hit,phase:state().phase,registered:Object.keys(MoveFX)}),state};
