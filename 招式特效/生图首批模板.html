</style><div class="app"><aside class="sidebar"><span class="eyebrow">GENERATED ART / IN-GAME SCALE</span><h1>生图重做 · 首批</h1><nav class="list" id="list" aria-label="选择招式"></nav><div class="metrics"><strong>这次只验两招</strong><br>范围缩短，不铺满场地<br>正常速度也能看清推进<br>喷口贴住精灵的嘴<br>图像来自实际生图</div><div class="notice">先验收这两招的尺度与节奏。<br>旧57招代码特效不混进本页。<br>不是57招已全部完成。</div></aside><main class="main"><div class="main-inner"><header class="header"><div><span class="eyebrow">IMAGE-GENERATED SPRITES / FIRST PASS</span><h2 id="name"></h2></div><span class="badge">实际生图 · 原游戏地图</span></header><p class="description" id="description"></p><div class="stage" tabindex="0" id="stage" aria-label="实景试招，可用上下方向键移动对手"><canvas id="view" width="1920" height="1080"></canvas><div class="phase"><span id="phase"></span><small id="timing"></small></div><div class="scene-state" id="contact"></div></div><div class="controls"><button id="play">暂停</button><button id="restart">重播</button><button id="normal" aria-pressed="true">正常速度</button><button id="slow" aria-pressed="false">慢放 ×0.5</button><span class="gap"></span><button id="front" aria-pressed="true">正前方</button><button id="dodge" aria-pressed="false">移出射线</button><button id="far" aria-pressed="false">射程外</button></div><input id="time" class="timeline" type="range" min="0" max="4" step="0.005" value="0" aria-label="拖动查看动作"><div class="ticks"><span>起手 0.75秒</span><span>缓慢推进</span><span>持续喷射</span><span>收招</span></div><p class="tips">↑ ↓ 移动怪力，试试能不能躲开。出招方向固定，不追着对手转。</p><div class="footer"><span id="status"></span><span>特效是Codex实际生成的透明PNG，程序仅裁切、缩放与播放。<br>当前是实景动作样品，未改正式游戏伤害或配招。</span></div></div></main></div>

'use strict';const $=id=>document.getElementById(id),ctx=$('view').getContext('2d'),ids=Object.keys(GENERATED),images={},keys=new Set();let current='flamethrower',t=0,speed=1,playing=true,mode='front',enemyShift=0,last=performance.now(),ready=false,renderError=null;const source={x:340,y:260};
const imageReady=Promise.all(ids.map(id=>new Promise((resolve,reject)=>{const im=new Image();images[id]=im;im.onload=resolve;im.onerror=()=>reject(Error('生图素材读取失败：'+id));im.src=GENERATED[id].src;})));
function pressed(id,on){$(id).setAttribute('aria-pressed',String(on));}function text(id,s){if($(id).textContent!==s)$(id).textContent=s;}function setPlay(v){playing=v;text('play',v?'暂停':'播放');}function total(){const m=GENERATED[current];return m.windup+m.reach/m.speed+m.hold+m.fade+m.rest;}
function muzzle(){const m=GENERATED[current],c=SCENE_DATA.characters[m.caster],a=c.art.shoot,body=c.meta.flightHeight?(a.bodyOffsets?.[6]?.[m.poseFrame]||[0,0]):[0,0],scale=c.meta.scale;return{x:source.x+(m.muzzle[0]-a.anchorX-body[0])*scale,y:source.y+(c.meta.flightHeight?0:26)+(m.muzzle[1]-a.anchorY-body[1])*scale};}
function snapshot(){const m=GENERATED[current],tip=muzzle(),travel=m.reach/m.speed,elapsed=t-m.windup,live=elapsed>=0&&elapsed<travel+m.hold+m.fade;let phase,u;if(t<m.windup){phase='charge';u=t/m.windup;}else if(elapsed<travel+m.hold){phase='action';u=Math.min(1,elapsed/(travel+m.hold));}else{phase='recover';u=Math.min(1,(elapsed-travel-m.hold)/(m.fade+m.rest));}const front=Math.max(0,Math.min(m.reach,elapsed*m.speed)),alpha=elapsed>travel+m.hold?Math.max(0,1-(elapsed-travel-m.hold)/m.fade):1,target={x:tip.x+m.reach+13+(mode==='far'?65:0),y:260+enemyShift+(mode==='dodge'?-72:0)};
// Geometric contact in this demo, never a timer-generated explosion or target lock.
const distance=target.x-16-tip.x,withinY=Math.abs(tip.y-(target.y+3))<=22,contact=live&&alpha>0&&front>=distance&&distance>=0&&withinY,visibleLength=contact?Math.min(front,distance+4):front;
return{m:{...m,kind:'beam'},t,phase,u,source:{...source},target,displayTarget:target,hit:contact,contact,seed:1,muzzle:tip,front,visibleLength,alpha,live,poseFrame:live?m.poseFrame:phase==='charge'?Math.min(3,Math.floor(u*4)):undefined,flightSeconds:travel,total:total(),playing,speed,mode,renderReady:ready};}
function effect(s){if(!s.live||s.visibleLength<=0||!ready)return;const m=s.m,im=images[current],scale=m.reach/m.frameWidth,frame=Math.floor((t-m.windup)*7)%4,clip=Math.max(0,Math.min(m.frameWidth,s.visibleLength/scale));ctx.save();try{ctx.globalAlpha=s.alpha;ctx.drawImage(im,0,frame*m.frameHeight,clip,m.frameHeight,Math.round(s.muzzle.x),s.muzzle.y-m.anchorY*scale,clip*scale,m.frameHeight*scale);}finally{ctx.restore();}}
function render(){ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;try{const s=snapshot();ScenePreview.draw(ctx,s,true);effect(s);text('phase',!ready?'素材载入中':s.phase==='charge'?'01 / 看清起手':s.phase==='action'?(s.front<s.m.reach?'02 / 向前推进':'03 / 持续喷射'):'04 / 收招');text('timing',`起手 ${s.m.windup.toFixed(2)}秒 · 推进 ${s.flightSeconds.toFixed(2)}秒`);text('contact',s.contact?'接触到对手':s.phase==='charge'?'准备出招':s.live?'尚未接触 / 打空':'等待下一次');$('time').value=t;text('status',`${t.toFixed(2)} / ${s.total.toFixed(2)}秒 · ${speed===1?'正常速度':'半速查看'} · ${s.m.reach}px 最大长度 · ${playing?'循环播放':'暂停'}`);}catch(e){renderError=String(e);setPlay(false);text('status','预览错误：'+e.message);console.error(e);}}
async function select(id){if(!GENERATED[id])throw Error('未知招式');current=id;ready=false;t=0;enemyShift=0;mode='front';setPlay(false);const m=GENERATED[id];text('name',m.name);text('description',`${ScenePreview.getCaster(id)}从嘴部喷出 · ${id==='watergun'?'细水柱，不画成箭头或水球':'短程连续火舌，不再横跨场地'}`);$('time').max=total();for(const b of $('list').children)b.setAttribute('aria-pressed',String(b.dataset.id===id));for(const x of ['front','dodge','far'])pressed(x,x==='front');await Promise.all([imageReady,ScenePreview.prepare(id)]);if(current!==id)return;ready=true;render();setPlay(true);}
for(const id of ids){const b=document.createElement('button');b.className='move';b.dataset.id=id;b.style.setProperty('--type-color',id==='watergun'?'#8fe2ef':'#ffa55c');b.innerHTML='<span class="body"><b>'+GENERATED[id].name+'</b><small>生图四帧 / 原生角色动作</small></span>';b.onclick=()=>select(id).catch(fail);$('list').append(b);}
function fail(e){renderError=String(e);setPlay(false);text('status',String(e));console.error(e);}function restart(){t=0;setPlay(true);render();}
$('play').onclick=()=>setPlay(!playing);$('restart').onclick=restart;$('normal').onclick=()=>{speed=1;pressed('normal',true);pressed('slow',false);};$('slow').onclick=()=>{speed=.5;pressed('normal',false);pressed('slow',true);};$('time').oninput=()=>{t=Number($('time').value);setPlay(false);render();};for(const id of ['front','dodge','far'])$(id).onclick=()=>{mode=id;enemyShift=0;for(const x of ['front','dodge','far'])pressed(x,x===id);restart();};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;if(['ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();keys.add(e.code);}});document.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden){setPlay(false);keys.clear();}});
function loop(now){const dt=Math.min(.08,(now-last)/1000);last=now;if(keys.size)enemyShift=Math.max(-120,Math.min(120,enemyShift+((keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0))*100*dt));if(playing&&ready)t=(t+dt*speed)%total();render();requestAnimationFrame(loop);}
window.__samples={select,snapshot,seek(value){t=Math.max(0,Math.min(total(),value));setPlay(false);render();},setMode(v){mode=v;enemyShift=0;render();},moveTarget(dy){enemyShift=dy;render();},error:()=>renderError,ids};select(current).catch(fail);requestAnimationFrame(loop);
